name: CI

on:
  push:
    # 不再只监听 main：当前主要工作在 feature 分支，只监听 main 会让分支工作完全失去验证。
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 = 长期 LTS（EOL 2028-04），26 = 当前 LTS（本机开发版本）。
        # Node 20 已于 2026-04-30 EOL，不再测试。
        node-version: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # cache: npm 与下面的 npm ci 都依赖 package-lock.json。
          # 该文件曾长期被 .git/info/exclude 排除，导致 CI 一直卡在本步骤失败。
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
